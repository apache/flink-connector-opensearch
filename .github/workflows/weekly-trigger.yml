# We need to specify repo related information here since Apache INFRA doesn't differentiate
# between several workflows with the same names while preparing a report for GHA usage
# https://infra-reports.apache.org/#ghactions
name: Weekly Trigger Flink Connector Opensearch
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: read-all

jobs:
  Trigger:
    if: github.repository == 'apache/flink-connector-opensearch'
    permissions:
      actions: write
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: "Decide and trigger weekly"
        uses: actions/github-script@v9
        with:
          script: |
            // Branches exercised by the weekly matrix. Keep in sync with weekly.yml.
            const branches = ['main', 'v1.2'];

            // Resolve the most recent weekly run to learn when it ran and whether it was green.
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly.yml',
              per_page: 1,
            });
            const lastRun = runs.workflow_runs[0];
            const lastConclusion = lastRun?.conclusion ?? undefined;
            const lastRunAt = lastRun?.created_at ?? undefined;

            async function trigger(reason) {
              core.info(`Triggering weekly: ${reason}.`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'weekly.yml',
                ref: context.ref.replace('refs/heads/', ''),
              });
            }

            // Manual triggers always run.
            if (context.eventName === 'workflow_dispatch') {
              await trigger('manual dispatch');
              return;
            }

            // No previous run, or last run failed/cancelled: run so failures get retried even without new commits.
            if (!lastRun) {
              await trigger('no previous weekly run found');
              return;
            }
            if (lastConclusion !== 'success') {
              await trigger(`last weekly run concluded '${lastConclusion ?? 'unknown'}', re-running`);
              return;
            }

            // Last weekly was green: skip unless any watched branch has new commits since it started (manual runs still work).
            for (const branch of branches) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: branch,
                since: lastRunAt,
                per_page: 1,
              });
              if (commits.length > 0) {
                await trigger(`new commits on ${branch} since ${lastRunAt}`);
                return;
              }
            }

            core.info(`No new commits on ${branches.join(', ')} since ${lastRunAt} and last weekly was green, skipping scheduled weekly.`);
